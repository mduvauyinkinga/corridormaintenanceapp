# Runs the test suites for the Corridor Maintenance App.
#
# - `npm run test` (server): validates the in-memory filter pipeline
#   (`js/tracking.js`) against a full 50-row dataset with an independent
#   ground-truth cross-check (P1).
# - `npm run smoke` (server): end-to-end auth + complaints API test.
#
# Run locally:  cd server && npm test
name: Test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  filters:
    name: In-memory filter validation (P1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Validate filtering in memory vs full dataset
        run: npm test

  smoke:
    name: Smoke tests (P1/P2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Run auth + complaints smoke suite
        run: npm run smoke

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your password — Corridor Hill Residence Maintenance System." />
  <meta name="theme-color" content="#143c5c" />
  <title>Forgot Password | Corridor Hill</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/jpeg" href="assets/images/corridor-logo.jpeg" />
  <link rel="apple-touch-icon" href="assets/images/corridor-logo.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__brand">
        <div class="auth-logo" aria-hidden="true">
          <img src="assets/images/corridor-logo.jpeg" alt="" width="72" height="72" />
        </div>
        <h1>Corridor Hill Residence</h1>
        <p>Reset your password</p>
      </div>

      <form id="forgot-password-form" class="form" novalidate>
        <div id="form-alert" class="form__alert" role="alert" hidden></div>

        <div class="form__group">
          <label class="form__label" for="email">Email <span class="form__required">*</span></label>
          <input
            class="form__input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@tut4life.ac.za"
            required
          />
          <p class="form__error" data-error="email" role="alert"></p>
        </div>

        <div class="form__actions">
          <button id="send-reset-btn" type="submit" class="btn btn--primary btn--block">
            Send Reset Link
          </button>
        </div>

        <p class="form__switch">
          Remember your password? <a href="login.html">Sign in</a>
        </p>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>

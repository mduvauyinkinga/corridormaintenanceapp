# Firebase Configuration
#
# Setup:
#   1. Push this repo to GitHub.
# Firebase Configuration
# Firebase Configuration
# Firebase configuration settings
#      and set CORS_ORIGIN below to your GitHub Pages URL.
services:
  - type: web
    name: corridor-maintenance-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_DRIVER
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: corridor-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # EDIT THIS to your GitHub Pages URL before first deploy —
      # production refuses to boot with CORS_ORIGIN=*.
      - key: CORS_ORIGIN
        value: https://mduvauyinkinga.github.io
      - key: ALLOWED_DOMAIN
        value: "@tut4life.ac.za"
      # Complaint retention: archive Completed/Cancelled after 14 days,
      # hard-delete them 6 months (180 days) after resolution.
      - key: ARCHIVE_AFTER_DAYS
        value: 14
      - key: DELETE_AFTER_DAYS
        value: 180
      # Management account — set these in the Render dashboard after the
      # first deploy (sync: false = you fill them in, never in git).
      - key: MANAGER_NAME
        value: Residence Manager
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_PASSWORD
        generateValue: false

databases:
  - name: corridor-postgres
    plan: free
    databaseName: corridor

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Set a new password — Corridor Hill Residence Maintenance System." />
  <meta name="theme-color" content="#143c5c" />
  <title>Reset Password | Corridor Hill</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/jpeg" href="assets/images/corridor-logo.jpeg" />
  <link rel="apple-touch-icon" href="assets/images/corridor-logo.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__brand">
        <div class="auth-logo" aria-hidden="true">
          <img src="assets/images/corridor-logo.jpeg" alt="" width="72" height="72" />
        </div>
        <h1>Corridor Hill Residence</h1>
        <p>Set a new password</p>
      </div>

      <form id="reset-password-form" class="form" novalidate>
        <div id="form-alert" class="form__alert" role="alert" hidden></div>

        <input type="hidden" id="token" name="token" />

        <div class="form__group">
          <label class="form__label" for="password">New Password <span class="form__required">*</span></label>
          <div class="password-wrap">
            <input
              class="form__input"
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="At least 8 characters"
              minlength="8"
              required
            />
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="strength" id="password-strength" aria-live="polite">
            <div class="strength__bar"><span class="strength__fill"></span></div>
            <span class="strength__label">Enter password</span>
          </div>
          <p class="form__error" data-error="password" role="alert"></p>
        </div>

        <div class="form__group">
          <label class="form__label" for="confirm-password">Confirm Password <span class="form__required">*</span></label>
          <div class="password-wrap">
            <input
              class="form__input"
              type="password"
              id="confirm-password"
              name="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter your password"
              minlength="8"
              required
            />
            <button type="button" class="password-toggle" data-password-toggle="confirm-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="form__error" data-error="confirmPassword" role="alert"></p>
        </div>

        <div class="form__actions">
          <button id="reset-btn" type="submit" class="btn btn--primary btn--block">
            Reset Password
          </button>
        </div>

        <p class="form__switch">
          Remember your password? <a href="login.html">Sign in</a>
        </p>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>

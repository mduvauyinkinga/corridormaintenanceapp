<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Choose your room and unit at Corridor Hill Residence." />
  <meta name="theme-color" content="#143c5c" />
  <title>Choose Your Room | Corridor Hill</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/jpeg" href="assets/images/corridor-logo.jpeg" />
  <link rel="apple-touch-icon" href="assets/images/corridor-logo.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card auth-card--wide">
      <div class="auth-card__brand">
        <div class="auth-logo" aria-hidden="true">
          <img src="assets/images/corridor-logo.jpeg" alt="" width="72" height="72" />
        </div>
        <h1>Choose Your Room</h1>
        <p>Select a block, then a room, then an available unit.</p>
      </div>

      <div id="form-alert" class="form__alert mb-3" role="alert" hidden></div>

      <!-- Progress indicator -->
      <ol class="room-progress mb-3" aria-label="Room selection progress">
        <li class="room-progress__step" data-step="1">
          <span class="room-progress__num">1</span>
          <span class="room-progress__label">Choose Block</span>
        </li>
        <li class="room-progress__step" data-step="2">
          <span class="room-progress__num">2</span>
          <span class="room-progress__label">Choose Unit Number</span>
        </li>
        <li class="room-progress__step" data-step="3">
          <span class="room-progress__num">3</span>
          <span class="room-progress__label">Choose Room</span>
        </li>
        <li class="room-progress__step" data-step="4">
          <span class="room-progress__num">4</span>
          <span class="room-progress__label">Confirm</span>
        </li>
      </ol>

      <!-- Step 1: Block -->
      <section class="room-step" aria-labelledby="block-title">
        <h3 id="block-title" class="room-step__title">Step 1 · Choose Block</h3>
        <select id="block-select" class="form__select" disabled>
          <option value="">Select a block…</option>
        </select>
        <p id="block-status" class="form__hint mt-1" role="status">Loading blocks…</p>
      </section>

      <!-- Step 2: Room Number -->
      <section class="room-step" aria-labelledby="room-title">
        <h3 id="room-title" class="room-step__title">Step 2 · Choose Room Number</h3>
        <select id="room-select" class="form__select" disabled>
          <option value="">Select a block first…</option>
        </select>
        <p id="room-status" class="form__hint mt-1" role="status">Select a block first.</p>
      </section>

      <!-- Step 3: Room Letter / Unit -->
      <section class="room-step" aria-labelledby="unit-title">
        <h3 id="unit-title" class="room-step__title">Step 3 · Choose Room</h3>
        <div id="unit-list" class="room-options"></div>
        <p id="unit-status" class="form__hint mt-1" role="status">Select a room first.</p>
      </section>

      <div id="selection-summary" class="room-selection-summary mt-3" hidden>
        <span id="selection-text"></span>
      </div>

      <div class="form__actions mt-3">
        <button id="confirm-btn" type="button" class="btn btn--primary btn--block" disabled>
          Confirm Room
        </button>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/choose-room.js"></script>
</body>
</html>
